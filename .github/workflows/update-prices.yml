name: Update LLM Pricing Daily

on:
  schedule:
    - cron: '0 4 * * *' # Runs daily at 04:00 UTC (12:00 UTC+8)
  workflow_dispatch: # Allows manual trigger from the Actions tab

permissions:
  contents: write # Required to push the commit back to the repo

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install DrissionPage requests

      - name: Run Price Crawler
        run: |
          python scripts/update_prices.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/llm-plans.json
          if git diff --staged --quiet; then
            echo "No price updates found."
          else
            git commit -m "chore: auto-update LLM prices [skip ci]"
            git push
          fi
